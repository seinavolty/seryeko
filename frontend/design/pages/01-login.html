<!DOCTYPE html>
<!--
  Hallmark · macrostructure: Split Studio · tone: playful-cinema · anchor: coral-pink 15°
  page: Login · nav: N5 floating pill · footer: none (auth page)
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign In — SeryeKo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Geist:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  overflow-x:clip;
  min-height:100dvh;
  background:oklch(10% 0.012 285);
  color:oklch(94% 0.006 285);
  font-family:"Geist",ui-sans-serif,system-ui,sans-serif;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
:root{
  --color-paper:oklch(10% 0.012 285);
  --color-paper-2:oklch(14% 0.013 285);
  --color-paper-3:oklch(18% 0.014 285);
  --color-rule:oklch(28% 0.010 285);
  --color-muted:oklch(48% 0.008 285);
  --color-neutral:oklch(62% 0.006 285);
  --color-ink:oklch(94% 0.006 285);
  --color-accent:oklch(68% 0.220 15);
  --color-accent-2:oklch(75% 0.180 20);
  --color-focus:oklch(72% 0.210 15);
  --color-error:oklch(60% 0.22 25);
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Geist",ui-sans-serif,system-ui,sans-serif;
  --font-outlier:"Space Mono",ui-monospace,monospace;
  --radius-sm:0.375rem;--radius-md:0.75rem;--radius-lg:1.25rem;
  --radius-xl:1.75rem;--radius-pill:100vmax;
  --dur-base:200ms;--ease-out:cubic-bezier(0.16,1,0.3,1);
}

/* Layout: full-height split on desktop, stack on mobile */
.auth-layout{
  display:grid;
  grid-template-columns:1fr;
  min-height:100dvh;
}
@media(min-width:60rem){
  .auth-layout{
    grid-template-columns:1fr 1fr;
  }
}

/* Left: visual panel (hidden on mobile, shown on md+) */
.auth-visual{
  display:none;
}
@media(min-width:60rem){
  .auth-visual{
    display:flex;
    position:relative;
    flex-direction:column;
    justify-content:flex-end;
    padding:3rem;
    background:oklch(14% 0.014 285);
    overflow:hidden;
  }
}
/* Poster grid background */
.visual-grid{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:4px;
  opacity:0.55;
}
.vg-cell{
  border-radius:8px;
  overflow:hidden;
}
.vg-cell:nth-child(1){background:linear-gradient(160deg,oklch(38% 0.16 300),oklch(18% 0.09 280));}
.vg-cell:nth-child(2){background:linear-gradient(160deg,oklch(42% 0.18 15),oklch(22% 0.10 350));}
.vg-cell:nth-child(3){background:linear-gradient(160deg,oklch(36% 0.15 200),oklch(16% 0.08 220));}
.vg-cell:nth-child(4){background:linear-gradient(160deg,oklch(40% 0.17 50),oklch(20% 0.09 30));}
.vg-cell:nth-child(5){background:linear-gradient(160deg,oklch(35% 0.14 120),oklch(15% 0.07 140));}
.vg-cell:nth-child(6){background:linear-gradient(160deg,oklch(39% 0.16 270),oklch(19% 0.09 260));}
.vg-cell:nth-child(7){background:linear-gradient(160deg,oklch(44% 0.18 340),oklch(24% 0.11 350));}
.vg-cell:nth-child(8){background:linear-gradient(160deg,oklch(37% 0.15 80),oklch(17% 0.08 70));}
.vg-cell:nth-child(9){background:linear-gradient(160deg,oklch(41% 0.17 180),oklch(21% 0.09 200));}
.vg-cell:nth-child(10){background:linear-gradient(160deg,oklch(36% 0.14 30),oklch(16% 0.08 20));}
.vg-cell:nth-child(11){background:linear-gradient(160deg,oklch(43% 0.17 250),oklch(23% 0.10 240));}
.vg-cell:nth-child(12){background:linear-gradient(160deg,oklch(38% 0.16 100),oklch(18% 0.08 90));}
/* overlay gradient */
.auth-visual::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,oklch(10% 0.012 285) 0%,oklch(10% 0.012 285 / 0.5) 45%,transparent 100%);
}
.visual-content{
  position:relative;
  z-index:1;
}
.visual-quote{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.8rem,3vw,2.8rem);
  line-height:1.1;
  letter-spacing:-0.025em;
  color:oklch(94% 0.006 285);
  margin-bottom:1rem;
}
.visual-quote em{
  font-style:normal;
  color:var(--color-accent);
}
.visual-sub{
  font-size:0.9rem;
  color:oklch(62% 0.006 285);
}

/* Right: form panel */
.auth-form-panel{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:clamp(2rem,6vw,4rem) clamp(1.25rem,5vw,3rem);
  min-height:100dvh;
}
@media(min-width:60rem){
  .auth-form-panel{min-height:auto;}
}

.auth-form-inner{
  width:100%;
  max-width:400px;
}

/* Back link */
.auth-back{
  display:inline-flex;
  align-items:center;
  gap:0.5rem;
  font-size:0.8rem;
  color:oklch(48% 0.008 285);
  text-decoration:none;
  margin-bottom:2.5rem;
  transition:color var(--dur-base) var(--ease-out);
}
.auth-back:hover{color:oklch(62% 0.006 285);}
.auth-back:focus-visible{outline:2px solid var(--color-focus);outline-offset:3px;border-radius:4px;}

/* Wordmark */
.auth-brand{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.5rem;
  letter-spacing:-0.025em;
  color:oklch(94% 0.006 285);
  margin-bottom:2rem;
  display:flex;
  align-items:center;
  gap:0.4rem;
}
.auth-brand .dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--color-accent);
  display:inline-block;
}

.auth-heading{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.75rem,4vw,2.4rem);
  letter-spacing:-0.025em;
  color:oklch(94% 0.006 285);
  line-height:1.1;
  margin-bottom:0.5rem;
}
.auth-sub{
  font-size:0.95rem;
  color:oklch(48% 0.008 285);
  margin-bottom:2rem;
  line-height:1.5;
}
.auth-sub a{
  color:var(--color-accent);
  text-decoration:none;
  font-weight:500;
}
.auth-sub a:hover{text-decoration:underline;}

/* Google button */
.btn-google{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.75rem;
  width:100%;
  padding:0.875rem 1.5rem;
  background:oklch(18% 0.014 285);
  border:1px solid oklch(28% 0.010 285);
  border-radius:var(--radius-pill);
  font-family:var(--font-display);
  font-weight:600;
  font-size:0.95rem;
  color:oklch(94% 0.006 285);
  cursor:pointer;
  text-decoration:none;
  transition:background var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out);
  white-space:nowrap;
}
.btn-google:hover{background:oklch(22% 0.014 285);border-color:oklch(38% 0.012 285);}
.btn-google:focus-visible{outline:2px solid var(--color-focus);outline-offset:3px;}
.google-icon{flex-shrink:0;}

/* Divider */
.auth-divider{
  display:flex;
  align-items:center;
  gap:1rem;
  margin:1.5rem 0;
}
.auth-divider::before,.auth-divider::after{
  content:"";
  flex:1;
  height:1px;
  background:oklch(28% 0.010 285);
}
.auth-divider span{
  font-family:var(--font-outlier);
  font-size:0.64rem;
  color:oklch(48% 0.008 285);
  letter-spacing:0.1em;
  text-transform:uppercase;
  white-space:nowrap;
}

/* Form */
.form-group{
  display:flex;
  flex-direction:column;
  gap:0.375rem;
  margin-bottom:1.25rem;
}
.form-label{
  font-family:var(--font-display);
  font-weight:600;
  font-size:0.8rem;
  color:oklch(62% 0.006 285);
  letter-spacing:0.04em;
}
.form-input{
  width:100%;
  padding:0.875rem 1rem;
  background:oklch(14% 0.013 285);
  border:1.5px solid oklch(28% 0.010 285);
  border-radius:var(--radius-md);
  font-family:var(--font-body);
  font-size:1rem;
  color:oklch(94% 0.006 285);
  outline:none;
  transition:border-color var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out);
  -webkit-appearance:none;
}
.form-input::placeholder{color:oklch(40% 0.008 285);}
.form-input:focus{
  border-color:var(--color-accent);
  box-shadow:0 0 0 3px oklch(68% 0.220 15 / 0.15);
}
.form-input:invalid:not(:placeholder-shown){
  border-color:var(--color-error);
}

/* password row */
.input-wrap{position:relative;}
.input-wrap .form-input{padding-right:3rem;}
.input-reveal{
  position:absolute;
  right:1rem;
  top:50%;
  translate:0 -50%;
  background:none;
  border:none;
  cursor:pointer;
  color:oklch(48% 0.008 285);
  display:flex;
  align-items:center;
  padding:0;
  transition:color var(--dur-base) var(--ease-out);
}
.input-reveal:hover{color:oklch(62% 0.006 285);}
.input-reveal:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px;border-radius:4px;}

.form-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:1.5rem;
}
.form-check{
  display:flex;
  align-items:center;
  gap:0.5rem;
  cursor:pointer;
}
.form-check input[type=checkbox]{
  width:16px;height:16px;
  accent-color:var(--color-accent);
  cursor:pointer;
}
.form-check span{
  font-size:0.85rem;
  color:oklch(62% 0.006 285);
}
.form-forgot{
  font-size:0.85rem;
  color:var(--color-accent);
  text-decoration:none;
  white-space:nowrap;
}
.form-forgot:hover{text-decoration:underline;}
.form-forgot:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px;border-radius:4px;}

.btn-primary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.5rem;
  width:100%;
  padding:1rem 1.5rem;
  background:var(--color-accent);
  border:none;
  border-radius:var(--radius-pill);
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.05rem;
  color:oklch(8% 0.010 285);
  cursor:pointer;
  text-decoration:none;
  transition:background var(--dur-base) var(--ease-out),transform 100ms var(--ease-out);
  white-space:nowrap;
}
.btn-primary:hover{background:var(--color-accent-2);transform:translateY(-1px);}
.btn-primary:focus-visible{outline:2px solid var(--color-focus);outline-offset:3px;}
.btn-primary:active{transform:translateY(0);}

/* Bottom register prompt */
.auth-prompt{
  margin-top:1.75rem;
  text-align:center;
  font-size:0.875rem;
  color:oklch(48% 0.008 285);
}
.auth-prompt a{
  color:var(--color-accent);
  text-decoration:none;
  font-weight:600;
}
.auth-prompt a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="auth-layout">

  <!-- Visual panel (desktop only) -->
  <aside class="auth-visual" aria-hidden="true">
    <div class="visual-grid">
      <div class="vg-cell"></div><div class="vg-cell"></div><div class="vg-cell"></div>
      <div class="vg-cell"></div><div class="vg-cell"></div><div class="vg-cell"></div>
      <div class="vg-cell"></div><div class="vg-cell"></div><div class="vg-cell"></div>
      <div class="vg-cell"></div><div class="vg-cell"></div><div class="vg-cell"></div>
    </div>
    <div class="visual-content">
      <p class="visual-quote">40+ providers.<br><em>One login.</em><br>Forever yours.</p>
      <p class="visual-sub">Korean · Chinese · Thai · Filipino dramas</p>
    </div>
  </aside>

  <!-- Form panel -->
  <main class="auth-form-panel">
    <div class="auth-form-inner">

      <a href="00-landing.html" class="auth-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Back to home
      </a>

      <div class="auth-brand" aria-label="SeryeKo">
        <span class="dot" aria-hidden="true"></span>SeryeKo
      </div>

      <h1 class="auth-heading">Welcome back.</h1>
      <p class="auth-sub">No account yet? <a href="02-register.html">Create one free →</a></p>

      <!-- Google OAuth -->
      <a href="#" class="btn-google" role="button" aria-label="Continue with Google">
        <svg class="google-icon" width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </a>

      <div class="auth-divider"><span>or sign in with email</span></div>

      <form method="POST" action="#" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" name="email"
            placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="password" name="password"
              placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="input-reveal" aria-label="Show password"
              onclick="const i=document.getElementById('password');i.type=i.type==='password'?'text':'password'">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="form-check">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#" class="form-forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign in
        </button>
      </form>

      <p class="auth-prompt">
        New here? <a href="02-register.html">Create your lifetime account →</a>
      </p>

    </div>
  </main>
</div>
</body>
</html>
