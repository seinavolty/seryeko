services:
  db:
    image: postgres:16-alpine
    container_name: seryeko-db
    environment:
      POSTGRES_USER: seryeko
      POSTGRES_PASSWORD: seryeko_local_dev
      POSTGRES_DB: seryeko
    ports:
      - "5432:5432"
    volumes:
      # Bind mount avoids named-volume chmod issues on some Docker setups
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seryeko -d seryeko"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: seryeko-api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://seryeko:seryeko_local_dev@db:5432/seryeko
      JWT_SECRET: local-dev-secret-change-me
      FRONTEND_URL: http://localhost:5173
      GOOGLE_REDIRECT_URI: http://localhost:5173/api/auth/google/callback
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.api-data:/data

  web:
    build: ./frontend
    container_name: seryeko-web
    ports:
      - "3000:8080"
    depends_on:
      - api
    # Local nginx proxies /api → api service
    volumes:
      - ./frontend/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
